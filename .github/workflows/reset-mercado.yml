name: Reset mercado diario

# 20:00 UTC = 22:00 en Madrid con horario de verano (CEST). Cuando España
# vuelva a horario de invierno (CET, últimos días de octubre) esto pasará a
# disparar a las 21:00 real — cron no entiende de DST. Si molesta, ajustar
# a '0 21 * * *' en ese momento del año.

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m src.ingesta.resetear_mercado
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
